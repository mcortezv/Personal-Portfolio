    <main>
        <form action="https://mibackend.com/contacto" method="post">
            <label for="nombre">Nombre Completo:
                <input type="text" id="nombre" placeholder="Ej. Manuel">
            </label>
            <br>

            <label for="email">Correo alternativo</label>
            <input type="email" name="email" id="email" required placeholder="ejemplo@gmail.com"
                pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$">
            <br>

            <label for="telefono">Telefono</label>
            <input type="tel" name="telefono" id="telefono">
            <br>

            <label for="edad">Edad</label>
            <input type="number" name="" id="">
            <br>

            <label for="fecha">Fecha</label>
            <input type="date">
            <br>

            <label for="motivo">Motivo de Contacto</label>
            <select name="motivo" id="motivo">
                <option value="">Selecione una opcion</option>
                <option value="">Trabajo</option>
            </select>
            <br>

            <label for="">Como te gustaria que te contacte?</label>
            <br>

            <input type="radio" id="contacto-correo" value="correo" name="type-contacto">
            <label for="contacto-correo">Correo</label>
            <br>

            <input type="radio" id="contacto-wa" value="whatsapp" name="type-contacto">
            <label for="contacto-wa">Whatsapp</label>
            <br>

            <button type="submit">Guardar</button>
            <button type="reset">Limpiar</button>
        </form>
    </main>
